<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Rentals | FurniRent</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            FurniRent
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#furniture">
                Furniture
            </a>

            <a href="index.html#how-it-works">
                How It Works
            </a>

            <a href="rentals.html">
                My Rentals
            </a>

            <a href="#" id="logoutLink">
                Logout
            </a>

        </nav>

    </header>



    <!-- ================= RENTALS ================= -->

    <main class="rentals-page">


        <div class="rentals-heading">

            <p>
                YOUR ACCOUNT
            </p>

            <h1>
                My Rentals
            </h1>

            <span>
                Keep track of the furniture you've rented.
            </span>

        </div>



        <div
            id="rentalsContainer"
            class="rentals-grid"
        >

            <div class="rentals-loading">

                Loading your rentals...

            </div>

        </div>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            FurniRent
        </div>


        <p>
            Furniture that fits your life.
        </p>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#furniture">
                Furniture
            </a>

            <a href="index.html#how-it-works">
                How It Works
            </a>

        </div>


        <p class="copyright">

            © 2026 FurniRent.
            All rights reserved.

        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // ==================================================
        // GET TOKEN
        // ==================================================

        const token =
            localStorage.getItem("token");


        const rentalsContainer =
            document.getElementById(
                "rentalsContainer"
            );


        console.log(
            "Token:",
            token
        );


        // If user is not logged in,
        // send them to login page.

        if (!token) {

            window.location.href =
                "login.html";

        }



        // ==================================================
        // LOGOUT
        // ==================================================

        document
            .getElementById("logoutLink")
            .addEventListener(
                "click",
                function (event) {

                    event.preventDefault();


                    localStorage.removeItem(
                        "token"
                    );

                    localStorage.removeItem(
                        "user"
                    );


                    window.location.href =
                        "index.html";

                }
            );



        // ==================================================
        // LOAD MY RENTALS
        // ==================================================

        async function loadRentals() {

            try {


                const response =
                    await fetch(
                        "http://localhost:5000/api/rentals/my",
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );



                const data =
                    await response.json();



                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load rentals"
                    );

                }



                displayRentals(data);


            }

            catch (error) {

                console.error(
                    "Load rentals error:",
                    error
                );


                rentalsContainer.innerHTML = `

                    <div class="rentals-error">

                        <h3>
                            Unable to load rentals
                        </h3>

                        <p>
                            ${error.message}
                        </p>

                    </div>

                `;

            }

        }



        // ==================================================
        // DISPLAY RENTALS
        // ==================================================

        function displayRentals(rentals) {


            // No rentals

            if (
                !rentals ||
                rentals.length === 0
            ) {

                rentalsContainer.innerHTML = `

                    <div class="no-rentals">

                        <h2>
                            No rentals yet
                        </h2>


                        <p>
                            You haven't rented any
                            furniture yet.
                        </p>


                        <a
                            href="index.html#furniture"
                            class="browse-button"
                        >
                            Browse Furniture
                        </a>

                    </div>

                `;

                return;

            }



            // Create rental cards

            rentalsContainer.innerHTML =
                rentals.map(
                    function (rental) {


                        const furniture =
                            rental.furniture ||
                            {};



                        // =========================
                        // DATES
                        // =========================

                        const startDate =
                            new Date(
                                rental.startDate
                            ).toLocaleDateString();



                        const endDate =
                            new Date(
                                rental.endDate
                            ).toLocaleDateString();



                        // =========================
                        // IMAGE
                        // =========================

                        const image =
                            furniture.image ||
                            "images/hero-bg.jpg";



                        // =========================
                        // STATUS
                        // =========================

                        // MongoDB currently stores:
                        // "pending"
                        // "approved"
                        // "completed"
                        // "cancelled"

                        const status =
                            (
                                rental.status ||
                                "pending"
                            ).toLowerCase();



                        // Display status with
                        // first letter uppercase

                        const displayStatus =
                            status.charAt(0).toUpperCase() +
                            status.slice(1);



                        // CSS status class

                        const statusClass =
                            status.replace(
                                /\s+/g,
                                "-"
                            );



                        // =========================
                        // CANCEL BUTTON
                        // =========================

                        let cancelButton = "";



                        // IMPORTANT:
                        // MongoDB has "pending"
                        // in lowercase.

                        if (
                            status === "pending"
                        ) {

                            cancelButton = `

                                <button
                                    class="cancel-rental-button"
                                    onclick="cancelRental('${rental._id}')"
                                >

                                    Cancel Rental

                                </button>

                            `;

                        }



                        // =========================
                        // RENTAL CARD
                        // =========================

                        return `

                            <article
                                class="rental-card"
                            >


                                <!-- IMAGE -->

                                <div
                                    class="rental-image"
                                >

                                    <img
                                        src="${image}"
                                        alt="${
                                            furniture.name ||
                                            "Furniture"
                                        }"
                                    >

                                </div>



                                <!-- INFORMATION -->

                                <div
                                    class="rental-info"
                                >


                                    <p
                                        class="rental-category"
                                    >

                                        ${
                                            furniture.category ||
                                            "Furniture"
                                        }

                                    </p>



                                    <h2>

                                        ${
                                            furniture.name ||
                                            "Furniture"
                                        }

                                    </h2>



                                    <!-- DATES -->

                                    <div
                                        class="rental-details"
                                    >


                                        <div>

                                            <span>
                                                START DATE
                                            </span>

                                            <strong>
                                                ${startDate}
                                            </strong>

                                        </div>



                                        <div>

                                            <span>
                                                END DATE
                                            </span>

                                            <strong>
                                                ${endDate}
                                            </strong>

                                        </div>


                                    </div>



                                    <!-- BOTTOM -->

                                    <div
                                        class="rental-bottom"
                                    >


                                        <!-- TOTAL -->

                                        <div>

                                            <span>
                                                TOTAL AMOUNT
                                            </span>

                                            <strong>
                                                ₹${rental.totalAmount}
                                            </strong>

                                        </div>



                                        <!-- STATUS + BUTTON -->

                                        <div
                                            class="rental-actions"
                                        >


                                            <span
                                                class="
                                                    rental-status
                                                    status-${statusClass}
                                                "
                                            >

                                                ${displayStatus}

                                            </span>



                                            ${cancelButton}


                                        </div>


                                    </div>


                                </div>


                            </article>

                        `;

                    }
                ).join("");

        }



        // ==================================================
        // CANCEL RENTAL
        // ==================================================

        async function cancelRental(
            rentalId
        ) {


            // Ask for confirmation

            const confirmed =
                confirm(
                    "Are you sure you want to cancel this rental?"
                );


            if (!confirmed) {

                return;

            }



            try {


                console.log(
                    "Cancelling rental:",
                    rentalId
                );



                // Send cancellation request

                const response =
                    await fetch(

                        `http://localhost:5000/api/rentals/${rentalId}/cancel`,

                        {

                            method: "PUT",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }

                    );



                const data =
                    await response.json();



                console.log(
                    "Cancel response:",
                    data
                );



                // Check backend response

                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to cancel rental"
                    );

                }



                // Success

                alert(
                    "Rental cancelled successfully!"
                );



                // Reload rentals

                loadRentals();


            }

            catch (error) {


                console.error(
                    "Cancel rental error:",
                    error
                );


                alert(
                    error.message ||
                    "Something went wrong"
                );

            }

        }



        // ==================================================
        // START APPLICATION
        // ==================================================

        loadRentals();


    </script>


</body>

</html>
