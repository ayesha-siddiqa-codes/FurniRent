<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | FurniRent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                FurniRent
            </div>

            <p class="auth-label">
                CREATE YOUR ACCOUNT
            </p>

            <h1>
                Start renting.
            </h1>

            <p class="auth-description">
                Create an account and discover furniture
                that fits your space and lifestyle.
            </p>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <p id="message" class="auth-message"></p>


            <p class="auth-switch">
                Already have an account?
                <a href="login.html">
                    Login
                </a>
            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const message =
            document.getElementById("message");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                message.textContent =
                    "Creating your account...";


                try {

                    const response =
                        await fetch(
                            "http://localhost:5000/api/auth/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    name,
                                    email,
                                    password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Registration failed"
                        );

                    }


                    message.textContent =
                        "Registration successful! Redirecting...";


                    setTimeout(function () {

                        window.location.href =
                            "login.html";

                    }, 1000);


                } catch (error) {

                    console.error(error);

                    message.textContent =
                        error.message ||
                        "Something went wrong.";

                }

            }
        );

    </script>

</body>
</html>
